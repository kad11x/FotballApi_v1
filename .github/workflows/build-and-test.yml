name: Build and test

on:
  push:
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - run: npm ci
      - run: npm run build

  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'

      - run: dotnet restore FotballApi.slnx
      - run: dotnet build FotballApi.slnx --no-restore
      - run: dotnet test FotballApi.slnx --no-build